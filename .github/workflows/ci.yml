name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libpipewire-0.3-dev clang libxkbcommon-dev libwayland-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The app embeds ui/dist at compile time, so the UI is built before clippy and tests.
      - name: UI
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Windows: the app bundles the overlay as a sidecar (tauri.windows.conf.json), and its build
      # script wants the target-suffixed binary to exist.
      - name: Overlay sidecar
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p arrowhead-overlay
          cp target/release/arrowhead-overlay.exe target/release/arrowhead-overlay-x86_64-pc-windows-msvc.exe

      # Windows: the app bundles the OCR models as resources (tauri.windows.conf.json).
      - name: OCR models
        if: runner.os == 'Windows'
        shell: bash
        run: bash packaging/fetch-ocr-models.sh default target/ocr-models

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p arrowhead-cli -- --version

  # The release's AppImage (release.yml runs only on a tag): build it here so a broken bundle
  # shows up on the pull request, not on release day.
  appimage:
    # the release's Linux job runs here too: an AppImage needs the oldest glibc it should run on
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libpipewire-0.3-dev clang libxkbcommon-dev libwayland-dev file librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: ui
      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          bash packaging/fetch-ocr-models.sh default target/ocr-models
          cargo build --release -p arrowhead-overlay
          cp target/release/arrowhead-overlay target/release/arrowhead-overlay-x86_64-unknown-linux-gnu
          npm --prefix ui run tauri build -- --bundles appimage --config ../crates/app/tauri.appimage.conf.json
      - name: Check its contents
        run: |
          f=$(realpath target/release/bundle/appimage/*.AppImage)
          ls -la "$f"
          cd "$(mktemp -d)" && "$f" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/arrowhead
          test -x squashfs-root/usr/bin/arrowhead-overlay
          test -f squashfs-root/usr/lib/arrowhead/models/text-detection.onnx
          test -f squashfs-root/usr/lib/arrowhead/models/text-recognition.onnx
