name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - id: v
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libpipewire-0.3-dev clang libxkbcommon-dev libwayland-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: npm ci
        working-directory: ui

      # tauri build runs the UI build first (beforeBuildCommand); --no-bundle: the tarball is ours.
      - name: Build app, cli, overlay
        run: |
          npm --prefix ui run tauri build -- --no-bundle
          cargo build --release -p arrowhead-cli -p arrowhead-overlay

      - name: Package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          name="arrowhead-${VERSION}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/arrowhead target/release/arrowhead-cli target/release/arrowhead-overlay "dist/$name/"
          cp LICENSE README.md packaging/arrowhead.desktop "dist/$name/"
          mkdir "dist/$name/icons"
          cp crates/app/icons/32x32.png "dist/$name/icons/32.png"
          cp crates/app/icons/128x128.png "dist/$name/icons/128.png"
          cp crates/app/icons/128x128@2x.png "dist/$name/icons/256.png"
          cp crates/app/icons/icon.png "dist/$name/icons/512.png"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      # The updater manifest (spec 10). --no-bundle makes no updater artifacts, so the tarball
      # is signed here with the updater key.
      - name: Sign and write latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cd dist
          ../ui/node_modules/.bin/tauri signer sign "$ASSET"
          notes="$(gh release view "$TAG" --json body -q .body 2>/dev/null || true)"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$ASSET.sig")" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/$ASSET" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"linux-x86_64": {signature: $signature, url: $url}}}' \
            > latest.json
          sha256sum "$ASSET" latest.json > SHA256SUMS

      - name: Upload to the release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/"$ASSET" dist/"$ASSET".sig dist/latest.json dist/SHA256SUMS --clobber

      # Release body: release-please notes (highlights + changes) with an Install block before the
      # first "### " section and a footer. Runs after latest.json so the updater gets the plain notes.
      - name: Add install block and footer
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release view "$TAG" --json body -q .body > notes.md
          grep -q '^### Install' notes.md && exit 0
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@TAG@/$TAG/g" .github/release-install.md > install.md
          awk 'FNR==NR{ins=ins $0 "\n"; next} !done && /^### /{printf "%s\n", ins; done=1} {print} END{if(!done) printf "\n%s", ins}' install.md notes.md > body.md
          printf '\n---\nMade by James Thiessen with Claude Code (Claude Opus 5.5). See the [AI use note](https://github.com/%s#ai-use).\n' "${{ github.repository }}" >> body.md
          gh release edit "$TAG" --notes-file body.md

  # Windows (v0.2): tauri build with the MSI bundler, plus a portable zip. Runs after the Linux
  # job, which creates the release and the first latest.json / SHA256SUMS; this job adds its own
  # files and rewrites those two (so the AUR job, which needs only linux, is unaffected).
  windows:
    needs: linux
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      VERSION: ${{ needs.linux.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: npm ci
        working-directory: ui

      # tauri build runs the UI build first (beforeBuildCommand) and the MSI bundler (WiX, which
      # tauri downloads); the zip is ours.
      # The overlay goes into the MSI as a sidecar (tauri.windows.conf.json), installed next to
      # arrowhead.exe, where the app looks for it.
      - name: Build app (MSI), cli and overlay
        run: |
          cargo build --release -p arrowhead-cli -p arrowhead-overlay
          cp target/release/arrowhead-overlay.exe target/release/arrowhead-overlay-x86_64-pc-windows-msvc.exe
          npm --prefix ui run tauri build -- --bundles msi

      - name: Package
        run: |
          mkdir -p dist
          msi="arrowhead-${VERSION}-windows-x86_64.msi"
          zip="arrowhead-${VERSION}-windows-x86_64.zip"
          cp target/release/bundle/msi/*.msi "dist/$msi"
          name="arrowhead-${VERSION}-windows-x86_64"
          mkdir -p "dist/$name"
          cp target/release/arrowhead.exe target/release/arrowhead-cli.exe target/release/arrowhead-overlay.exe LICENSE README.md "dist/$name/"
          (cd dist && powershell -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$zip'")
          echo "MSI=$msi" >> "$GITHUB_ENV"
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      # The updater replaces the MSI, so the MSI is what gets signed and listed in latest.json.
      - name: Sign, merge into latest.json and SHA256SUMS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd dist
          ../ui/node_modules/.bin/tauri signer sign "$MSI"
          gh release download "$TAG" -p latest.json -p SHA256SUMS
          jq \
            --arg signature "$(cat "$MSI.sig")" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/$MSI" \
            '.platforms["windows-x86_64"] = {signature: $signature, url: $url}' \
            latest.json > latest.new
          mv latest.new latest.json
          grep -v ' latest.json$' SHA256SUMS > sums.new || true
          sha256sum "$MSI" "$ZIP" latest.json >> sums.new
          mv sums.new SHA256SUMS

      - name: Upload to the release
        run: gh release upload "$TAG" dist/"$MSI" dist/"$MSI".sig dist/"$ZIP" dist/latest.json dist/SHA256SUMS --clobber

  aur:
    needs: linux
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      VERSION: ${{ needs.linux.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump PKGBUILD
        run: |
          gh release download "$TAG" -p SHA256SUMS
          sum="$(grep "linux-x86_64.tar.gz$" SHA256SUMS | cut -d' ' -f1)"
          sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^pkgrel=.*/pkgrel=1/" -e "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/aur/PKGBUILD
          sed -i -e "s/pkgver = .*/pkgver = $VERSION/" -e "s/pkgrel = .*/pkgrel = 1/" -e "s/sha256sums = .*/sha256sums = $sum/" \
            -e "s#arrowhead-[0-9][^/]*-linux-x86_64.tar.gz#arrowhead-$VERSION-linux-x86_64.tar.gz#g" \
            -e "s#download/v[^/]*/#download/v$VERSION/#g" packaging/aur/.SRCINFO
          rm SHA256SUMS
      - name: Commit the bump to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet && exit 0
          git commit -am "chore(aur): arrowhead-bin $VERSION"
          git push origin HEAD:main
      # Skipped until the AUR_SSH_KEY and AUR_EMAIL secrets exist (spec 10).
      - name: Publish to the AUR
        if: env.AUR_SSH_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: arrowhead-bin
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: James Thiessen
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: arrowhead-bin ${{ env.VERSION }}
