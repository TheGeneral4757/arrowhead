name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      # Merging its PR tags vX.Y.Z and writes the release notes; the tag runs release.yml.
      # Tags made with GITHUB_TOKEN do not trigger workflows, so a PAT (RELEASE_TOKEN) is used when set.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
