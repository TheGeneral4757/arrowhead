[package]
name = "arrowhead-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
arrowhead-core.workspace = true
serde.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev.workspace = true
zbus.workspace = true
tokio.workspace = true
ashpd = { workspace = true, features = ["global_shortcuts"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp"] }
