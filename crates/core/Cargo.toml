[package]
name = "arrowhead-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[features]
# Synthetic frame generator for other crates' tests and the CLI.
testkit = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
dirs.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
