[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license-file = "LICENSE"
repository = "https://github.com/TheGeneral4757/arrowhead"

# Pinned as each milestone starts using them (see docs/specs/01-workspace.md).
[workspace.dependencies]
arrowhead-core = { path = "crates/core" }
arrowhead-capture = { path = "crates/capture" }
arrowhead-input = { path = "crates/input" }
tauri = "2.12"
tauri-build = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
dirs = "7"
zstd = "0.14"
libc = "0.2"
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.10"
tokio = { version = "1", features = ["rt", "time"] }
tempfile = "3"
clap = { version = "4.6", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
