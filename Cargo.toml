[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license-file = "LICENSE"
repository = "https://github.com/TheGeneral4757/arrowhead"

# Pinned as each milestone starts using them (see docs/specs/01-workspace.md).
[workspace.dependencies]
arrowhead-core = { path = "crates/core" }
arrowhead-capture = { path = "crates/capture" }
arrowhead-input = { path = "crates/input" }
arrowhead-runner = { path = "crates/runner" }
tauri = "2.12"
tauri-build = "2.7"
tauri-plugin-updater = "2.12"
tauri-plugin-window-state = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
dirs = "7"
zstd = "0.14"
libc = "0.2"
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.10"
tokio = { version = "1", features = ["rt", "time", "net"] }
tempfile = "3"
clap = { version = "4.6", features = ["derive"] }
png = "0.18"
evdev = "0.13"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
windows = "0.62"
windows-capture = "2.0"
zbus = { version = "6.5", default-features = false, features = ["tokio", "service"] }
rand_chacha = "0.9"

# Detection and the synthetic frame tests are pixel loops; debug builds are too slow for them.
[profile.dev.package.arrowhead-core]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
